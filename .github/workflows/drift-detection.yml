name: GoldenEye - Drift Detection

on:
  workflow_dispatch:
  schedule:
    # Run daily at 08:17 UTC.
    - cron: "17 8 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    name: Detect Infrastructure Drift
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DRIFT_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialise Terraform
        run: terraform init -input=false

      - name: Check for infrastructure drift
        id: drift
        shell: bash
        run: |
          set +e
          terraform plan \
            -input=false \
            -detailed-exitcode \
            -no-color \
            -out=drift.tfplan
          exit_code=$?
          set -e

          echo "exitcode=$exit_code" >> "$GITHUB_OUTPUT"

          case "$exit_code" in
            0)
              echo "Drift status: No changes detected."
              ;;
            1)
              echo "Error: Terraform plan failed."
              exit 1
              ;;
            2)
              echo "Drift status: Changes detected."
              ;;
            *)
              echo "Error: Unexpected Terraform exit code: $exit_code"
              exit 1
              ;;
          esac

      - name: Report drift result
        if: always()
        shell: bash
        env:
          PLAN_OUTCOME: ${{ steps.drift.outcome }}
          PLAN_EXIT_CODE: ${{ steps.drift.outputs.exitcode }}
        run: |
          echo "========================================"
          echo "GoldenEye Infrastructure Drift Report"
          echo "========================================"
          echo "Detection step outcome: ${PLAN_OUTCOME:-not completed}"
          echo "Terraform plan exit code: ${PLAN_EXIT_CODE:-unavailable}"

          if [ "$PLAN_EXIT_CODE" = "0" ]; then
            echo "Result: No changes detected."
            echo "Action: No remediation required."
          elif [ "$PLAN_EXIT_CODE" = "2" ]; then
            echo "Result: Infrastructure changes detected."
            echo "Action: Review the Terraform plan before making changes."
          else
            echo "Result: Drift detection failed or did not complete."
            echo "Action: Review the workflow logs and investigate the error."
            exit 1
          fi

          echo "========================================"
