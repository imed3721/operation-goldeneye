name: GoldenEye - Controlled Teardown

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: Destroy GoldenEye Infrastructure
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialise Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Generate destroy plan
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -no-color \
            -out=goldeneye-destroy.tfplan

      - name: Display destroy plan
        run: terraform show -no-color goldeneye-destroy.tfplan

      - name: Apply destroy plan
        run: terraform apply -input=false -no-color goldeneye-destroy.tfplan

      - name: Report teardown result
        if: success()
        run: |
          echo "========================================"
          echo "GoldenEye Controlled Teardown"
          echo "========================================"
          echo "Terraform destroy completed successfully."
          echo "Resources managed by this Terraform state"
          echo "have been scheduled for deletion and removed"
          echo "where AWS completed the deletion successfully."
          echo "Terraform state has been updated."
          echo "========================================"

      - name: Report failure
        if: failure()
        run: |
          echo "========================================"
          echo "GoldenEye Controlled Teardown"
          echo "========================================"
          echo "Teardown failed or did not complete."
          echo "Review the failed step and AWS/Terraform logs."
          echo "Do not assume all resources were deleted."
          echo "========================================"
